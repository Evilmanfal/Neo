[workspace]
resolver = "2"
members = ["crates/neo-core", "crates/neo-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# GPUI 0.2.2 with one change: the Windows vsync thread parks while idle (see vendor/gpui/NEO-PATCH.md).
gpui = { path = "vendor/gpui" }
